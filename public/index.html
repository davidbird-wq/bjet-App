<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>DeltaMath - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1a2a3a 0%, #273e4f 50%, #1e3a5f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
      color: rgba(255, 255, 255, 0.85);
    }
    input[type="password"] {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="password"]:focus {
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.3);
    }
    button {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.9rem;
      border: none;
      border-radius: 8px;
      background: #2b5797;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #3a6bb0; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      margin-top: 1rem;
      padding: 0.75rem;
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid rgba(220, 53, 69, 0.4);
      border-radius: 8px;
      color: #ff8a8a;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    .error.visible { display: block; }
    .loading {
      text-align: center;
      margin-top: 1rem;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-box" id="loginBox">
    <h1>DeltaMath</h1>
    <p class="subtitle">Enter password to continue</p>
    <form id="loginForm">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required autofocus />
      <button type="submit" id="submitBtn">Unlock</button>
    </form>
    <div class="error" id="errorMsg">Incorrect password. Please try again.</div>
    <div class="loading" id="loadingMsg">Checking…</div>
  </div>

  <script>
    // Already authenticated this session?
    if (sessionStorage.getItem('deltamath_auth') === '1') {
      loadApp();
    }

    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const loadingMsg = document.getElementById('loadingMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      loadingMsg.style.display = 'block';
      submitBtn.disabled = true;

      const entered = passwordInput.value.trim();

      try {
        const res = await fetch('passwords.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('Could not load passwords.json');

        const data = await res.json();
        const validPasswords = Array.isArray(data) ? data : (data.passwords || []);

        if (validPasswords.includes(entered)) {
          sessionStorage.setItem('deltamath_auth', '1');
          loadApp();
        } else {
          errorMsg.classList.add('visible');
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        console.error(err);
        errorMsg.textContent = 'Error loading password list. Check passwords.json is present.';
        errorMsg.classList.add('visible');
      } finally {
        loadingMsg.style.display = 'none';
        submitBtn.disabled = false;
      }
    });

    function loadApp() {
      // Full document rewrite – most reliable for deferred scripts + Scramjet
      const targetHTML = `<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>DeltaMath</title>
		<link rel="shortcut icon" content="favicon.ico" />
	
		<script src="/scram/scramjet.all.js"><\/script>
		<script src="/baremux/index.js"><\/script>
		
		<link rel="stylesheet" href="index.css" />
		<script src="register-sw.js" defer><\/script>
		<script src="search.js" defer><\/script>
		<script src="index.js" defer><\/script>
	</head>
	<body>
		<div title="Scramjet Logo" class="flex-center logo-wrapper header-center">
			<img class="logo" src="sj.png" alt="Scramjet" />
			<h1>Deltamath | Math done <i>right</i>. Depth, clarity, rigor.</h1>
		</div>
		<div class="flex-center desc left-margin">
			<p>
				DeltaMath is the #1 chosen teaching platform used by teachers.
			</p>
		</div>
		<form id="sj-form" class="flex-center">
			<input
				id="sj-search-engine"
				value="https://www.google.com/search?q=%s"
				type="hidden"
			/>
			<input id="sj-address" type="text" placeholder="Find a lesson" />
		</form>
		<div class="desc left-margin">
			<p id="sj-error"></p>
			<pre id="sj-error-code"></pre>
		</div>
		<footer>
		</footer>
	</body>
</html>`;

      document.open();
      document.write(targetHTML);
      document.close();
    }
  </script>
</body>
</html>
