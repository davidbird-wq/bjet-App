<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>DeltaMath - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1a2a3a 0%, #273e4f 50%, #1e3a5f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
      color: rgba(255, 255, 255, 0.85);
    }
    input[type="password"] {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="password"]:focus {
      border-color: #4a90d9;
      box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.3);
    }
    button {
      width: 100%;
      margin-top: 1.25rem;
      padding: 0.9rem;
      border: none;
      border-radius: 8px;
      background: #2b5797;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover { background: #3a6bb0; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      margin-top: 1rem;
      padding: 0.75rem;
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid rgba(220, 53, 69, 0.4);
      border-radius: 8px;
      color: #ff8a8a;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    .error.visible { display: block; }
    .loading {
      text-align: center;
      margin-top: 1rem;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-box" id="loginBox">
    <h1>DeltaMath</h1>
    <p class="subtitle">Enter password to continue</p>
    <form id="loginForm">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required autofocus />
      <button type="submit" id="submitBtn">Unlock</button>
    </form>
    <div class="error" id="errorMsg">Incorrect password. Please try again.</div>
    <div class="loading" id="loadingMsg">Checking…</div>
  </div>

  <script>
    // Check if already authenticated this session
    if (sessionStorage.getItem('deltamath_auth') === '1') {
      loadApp();
    }

    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const loadingMsg = document.getElementById('loadingMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      loadingMsg.style.display = 'block';
      submitBtn.disabled = true;

      const entered = passwordInput.value.trim();

      try {
        const res = await fetch('passwords.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('Could not load passwords.json');

        const data = await res.json();
        const validPasswords = Array.isArray(data) ? data : (data.passwords || []);

        if (validPasswords.includes(entered)) {
          sessionStorage.setItem('deltamath_auth', '1');
          loadApp();
        } else {
          errorMsg.classList.add('visible');
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        console.error(err);
        errorMsg.textContent = 'Error loading password list. Check passwords.json is present.';
        errorMsg.classList.add('visible');
      } finally {
        loadingMsg.style.display = 'none';
        submitBtn.disabled = false;
      }
    });

    function loadApp() {
      // Hide login UI immediately
      const loginBox = document.getElementById('loginBox');
      if (loginBox) loginBox.remove();

      // Reset body styles so the app can take over
      document.body.style.cssText = '';
      document.body.innerHTML = '<noscript>You need to enable JavaScript to run this app.</noscript><div id="root"></div>';

      // Update title
      document.title = 'DeltaMath';

      // Helper to load a stylesheet
      function loadCSS(href) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        document.head.appendChild(link);
      }

      // Helper to load a script and return a promise that resolves when it loads
      function loadScript(src, isDefer = false) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          if (isDefer) script.defer = true;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error('Failed to load ' + src));
          document.head.appendChild(script);
        });
      }

      // Load all original CSS first
      loadCSS('/app/manager/assets/desmos-mathquill/mathquill.css');
      loadCSS('/app/manager/assets/prism/prism.css');
      loadCSS('/app/manager/assets/fontawesome-5/css/fontawesome.min.css');
      loadCSS('/app/manager/assets/fontawesome-5/css/solid.min.css');
      loadCSS('/app/manager/assets/fontawesome-5/css/regular.min.css');
      loadCSS('/app/manager/assets/fontawesome-5/css/light.min.css');
      loadCSS('/app/manager/assets/fontawesome-5/css/duotone.min.css');
      loadCSS('/app/manager/fonts.css');
      loadCSS('/app/manager/global/module-palette.css');
      loadCSS('/app/manager/global/module-typography.css');
      loadCSS('/app/manager/static/css/main.af0bb745.css');

      // Favicon / meta (optional but nice)
      const apple = document.createElement('link');
      apple.rel = 'apple-touch-icon';
      apple.sizes = '180x180';
      apple.href = '/app/manager/apple-touch-icon.png';
      document.head.appendChild(apple);

      // Now load scripts in the same order as the original (most are sync)
      // We chain them so order is preserved
      (async () => {
        try {
          // Early error handler (inline in original)
          window.legacyScriptErrors = [];
          window.addEventListener('error', function(r) {
            var e = r.target && r.target.tagName === 'SCRIPT' ? r.target.src : r.filename || '';
            if (window.legacyScriptErrors && /\/(global|assets)\//.test(e)) {
              window.legacyScriptErrors.push({ src: e, message: r.message || 'failed to load' });
            }
          }, true);

          await loadScript('/app/manager/assets/fastclick/lib/fastclick.js');
          await loadScript('/app/manager/global/module-palette-data.js');
          await loadScript('/app/manager/global/helper-functions.js');
          await loadScript('/app/manager/global/katex.min.js');
          await loadScript('/app/manager/global/lodash.js');
          await loadScript('/app/manager/assets/jquery.min.js');
          await loadScript('/app/manager/global/index.js');
          await loadScript('/app/manager/global/ascii_math.js');
          await loadScript('/app/manager/assets/jquery.auto-grow-input.min.js');
          await loadScript('/app/manager/assets/desmos-mathquill/mathquill.js');
          await loadScript('/app/manager/assets/desmos-mathquill/choose-interface.js');
          await loadScript('/app/manager/global/d3.min.js');
          await loadScript('/app/manager/global/d3-regression.min.js');
          await loadScript('/app/manager/global/ml-matrix.umd.js');
          await loadScript('/app/manager/global/ml-levenberg-marquardt.js');
          await loadScript('/app/manager/global/dmKAS.js');
          await loadScript('/app/manager/global/dmGraph.js');
          await loadScript('/app/manager/assets/dragula/dragula.js');
          await loadScript('/app/manager/assets/prism/prism.js');

          // The jQuery wheel handler from original
          if (window.$) {
            $(document).ready(function() {
              $(document).on('wheel', 'input[type=number]', function(n) {
                $(this).trigger('blur');
              });
            });
          }

          // Finally the main deferred app bundle
          await loadScript('/app/manager/static/js/main.5192a609.js', true);

        } catch (err) {
          console.error('Failed to load DeltaMath assets:', err);
          document.body.innerHTML = '<div style="padding:2rem;color:#fff;font-family:sans-serif;background:#1a2a3a;min-height:100vh">' +
            '<h2>Failed to load DeltaMath</h2>' +
            '<p>Could not load one or more scripts from /app/manager/...</p>' +
            '<p style="color:#ff8a8a">' + err.message + '</p>' +
            '<p>Make sure this page is being served from a location where the /app/manager assets are available.</p>' +
            '</div>';
        }
      })();
    }
  </script>
</body>
</html>
