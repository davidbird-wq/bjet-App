<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>DeltaMath - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a1a;
    }
    .login-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 2.25rem 2rem;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
      text-align: center;
      color: #1a1a1a;
    }
    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: #4b5563;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      color: #1a1a1a;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input[type="password"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      background: #fff;
    }
    button {
      width: 100%;
      margin-top: 1.1rem;
      padding: 0.8rem;
      border: none;
      border-radius: 8px;
      background: #1e40af;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #1e3a8a; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      margin-top: 0.9rem;
      padding: 0.65rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #b91c1c;
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }
    .error.visible { display: block; }
    .loading {
      text-align: center;
      margin-top: 0.9rem;
      color: #6b7280;
      font-size: 0.875rem;
      display: none;
    }
    .debug {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #9ca3af;
      text-align: center;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>DeltaMath</h1>
    <p class="subtitle">Enter password to continue</p>
    <form id="loginForm">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required autofocus />
      <button type="submit" id="submitBtn">Unlock</button>
    </form>
    <div class="error" id="errorMsg"></div>
    <div class="loading" id="loadingMsg">Checking…</div>
    <div class="debug" id="debugInfo"></div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const passwordInput = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const loadingMsg = document.getElementById('loadingMsg');
    const submitBtn = document.getElementById('submitBtn');
    const debugInfo = document.getElementById('debugInfo');

    // Show current location so we can debug path issues
    debugInfo.textContent = 'Page: ' + window.location.href;

    // Already authenticated this session?
    if (sessionStorage.getItem('deltamath_auth') === '1') {
      goToApp();
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
    }

    function goToApp() {
      const target = new URL('app.html', window.location.href).href;
      console.log('Redirecting to:', target);
      window.location.href = target;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      loadingMsg.style.display = 'block';
      submitBtn.disabled = true;

      const entered = passwordInput.value.trim();

      try {
        const res = await fetch(new URL('passwords.json', window.location.href).href, { cache: 'no-store' });
        if (!res.ok) throw new Error('Could not load passwords.json (status ' + res.status + ')');

        const data = await res.json();
        const validPasswords = Array.isArray(data) ? data : (data.passwords || []);

        if (validPasswords.includes(entered)) {
          sessionStorage.setItem('deltamath_auth', '1');
          goToApp();
        } else {
          showError('Incorrect password. Please try again.');
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        console.error(err);
        showError('Error: ' + err.message + '. Make sure passwords.json is next to this file.');
      } finally {
        loadingMsg.style.display = 'none';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
